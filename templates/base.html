<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registro de vacaciones</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f7fa;color:#17324d;font-family:Arial,sans-serif}.wrap{max-width:640px;margin:24px auto;padding:14px}.card{background:white;border:1px solid #d9e2ec;border-radius:18px;padding:26px;box-shadow:0 8px 28px #18334d0d}.brand{text-align:center;margin-bottom:24px}.brand h1{font-size:23px;margin:8px 0}.muted,.note{color:#64748b;font-size:13px;line-height:1.5}label,.label{display:block;font-weight:bold;font-size:14px;margin:15px 0 8px}input[type=text],input[type=password],input[type=date]{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px}.choices{display:flex;gap:12px}.choice{flex:1;border:1px solid #d9e2ec;border-radius:10px;padding:14px;display:flex;gap:9px;align-items:center}.choice input{width:auto}button,.btn{display:inline-block;background:#087e8b;color:white;border:0;border-radius:10px;padding:14px 18px;font-size:15px;font-weight:bold;text-align:center;text-decoration:none;cursor:pointer}button{width:100%;margin-top:22px}.secondary{background:#e2e8f0;color:#17324d}.hidden{display:none}.flash{background:#fee2e2;color:#991b1b;border-radius:9px;padding:12px;margin-bottom:14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stats{display:flex;gap:10px;margin:18px 0}.stat{background:#f1f5f9;border-radius:10px;padding:14px;flex:1}.stat strong{font-size:24px;display:block}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:10px;border-bottom:1px solid #d9e2ec;white-space:nowrap}th{background:#f1f5f9}.head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}@media(max-width:520px){.wrap{margin:6px auto;padding:8px}.card{padding:20px}.row{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><section class="card">{% with msgs=get_flashed_messages() %}{% for m in msgs %}<div class="flash">{{m}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</section></main>{% block scripts %}{% endblock %}</body></html>
